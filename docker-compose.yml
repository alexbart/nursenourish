version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nursenourish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/nursenourish
      - JWT_SECRET=secret
      - JWT_REFRESH_SECRET=refresh-secret
      - PAYSTACK_SECRET_KEY=sk_test
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_PAYSTACK_PUBLIC_KEY=pk_test
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: